<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/enhancements.css">
  <link rel="stylesheet" href="/ui-enhancements.css">
  <title>OpenCode</title>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <button class="primary" id="newSession">+ Новая</button>
        <button class="project-button" id="chooseProject" title="Открыть проект или папку на ПК">Проекты</button>
        <button class="icon" id="refresh" title="Обновить">↻</button>
      </div>
      <div class="provider-limits" id="providerLimits" aria-live="polite">
        <div class="quota-title"><span>Лимиты</span></div>
        <div class="quota-note">Загрузка…</div>
      </div>
      <div class="side-tools">
        <input class="search" id="search" placeholder="Поиск сессий…" autocomplete="off">
        <label class="check"><input id="showArchived" type="checkbox"> Архив</label>
      </div>
      <div class="sessions" id="sessions"><div class="loading">Загрузка…</div></div>
    </aside>

    <main class="main">
      <header class="header">
        <button class="icon menu" id="menu" aria-label="Меню">☰</button>
        <div class="header-main">
          <div class="header-title" id="headerTitle">OpenCode</div>
          <div class="header-sub" id="headerSub"></div>
        </div>
        <button class="header-chip" id="usageButton" title="Контекст и расходы">Контекст —</button>
        <button class="header-chip" id="gitButton" title="Git и изменения" disabled>Git —</button>
        <button class="icon" id="notifyButton" title="Уведомления">♢</button>
        <button class="icon" id="sessionActions" title="Действия с сессией" disabled>•••</button>
      </header>

      <section class="messages" id="messages">
        <div id="messagesInner"><div class="welcome">Выбери сессию или задай быстрый вопрос.</div></div>
      </section>

      <div class="permission-banner" id="permissionBanner" hidden>
        <div class="permission-text"><strong id="permissionTitle">Требуется разрешение</strong><span id="permissionDetail"></span></div>
        <button data-permission="reject">Отклонить</button>
        <button class="primary" data-permission="once">Разрешить</button>
        <button data-permission="always">Всегда</button>
      </div>

      <div class="composer-wrap">
        <div class="composer-meta">
          <div class="controls">
            <div class="mode-group" id="agentControls"></div>
            <button class="control" id="modelButton" disabled>Модель</button>
            <select class="control" id="variantSelect" disabled><option>Effort —</option></select>
          </div>
          <div class="delivery" id="deliveryControls" hidden>
            <button class="delivery-button active" data-delivery="steer">Steer</button>
            <button class="delivery-button" data-delivery="queue">Queue</button>
          </div>
        </div>
        <div class="attachments" id="attachments" hidden></div>
        <form class="composer" id="form">
          <div class="slash-palette" id="slashPalette" hidden></div>
          <button class="icon attach" id="attachButton" type="button" title="Файл">＋</button>
          <input id="fileInput" type="file" multiple hidden>
          <textarea id="input" rows="1" placeholder="Сообщение…"></textarea>
          <button class="send" id="send" type="submit" title="Отправить">↑</button>
          <button class="stop" id="stop" type="button" title="Остановить" hidden>■</button>
        </form>
      </div>
    </main>
  </div>

  <dialog id="projectDialog"><div class="modal"><div class="modal-head"><h3 id="projectDialogTitle">Выбрать проект</h3><button class="icon" data-close="projectDialog">×</button></div><div id="projectChoices" class="choice-list"></div></div></dialog>
  <dialog id="modelDialog"><div class="modal"><div class="modal-head"><h3>Модель</h3><button class="icon" data-close="modelDialog">×</button></div><input type="hidden" id="modelSearch" value=""><div id="modelChoices" class="choice-list"></div></div></dialog>
  <dialog id="sessionDialog"><div class="modal"><div class="modal-head"><h3>Сессия</h3><button class="icon" data-close="sessionDialog">×</button></div><div id="sessionActionList" class="action-list"></div></div></dialog>
  <dialog id="renameDialog"><form class="modal" id="renameForm"><div class="modal-head"><h3>Переименовать</h3><button class="icon" type="button" data-close="renameDialog">×</button></div><input class="text-input" id="renameInput" maxlength="200"><div class="modal-actions"><button type="button" data-close="renameDialog">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form></dialog>
  <dialog id="gitDialog"><div class="modal large"><div class="modal-head"><h3>Изменения</h3><button class="icon" data-close="gitDialog">×</button></div><div id="gitSummary" class="panel-summary"></div><div id="gitFiles" class="file-list"></div><div id="gitDiff" class="diff-view"></div></div></dialog>
  <dialog id="fileDialog"><div class="modal large"><div class="modal-head"><h3 id="fileTitle">Файл</h3><button class="icon" data-close="fileDialog">×</button></div><pre class="file-content" id="fileContent"></pre></div></dialog>
  <dialog id="usageDialog"><div class="modal"><div class="modal-head"><h3>Контекст и расходы</h3><button class="icon" data-close="usageDialog">×</button></div><div id="usageDetails"></div></div></dialog>
  <dialog id="confirmDialog"><div class="modal"><div class="modal-head"><h3 id="confirmTitle">Подтверждение</h3></div><p id="confirmText"></p><div class="modal-actions"><button id="confirmCancel">Отмена</button><button class="danger" id="confirmOk">Продолжить</button></div></div></dialog>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/enhancements.js"></script>
  <script type="module" src="/ui-enhancements.js"></script>
</body>
</html>
