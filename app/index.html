<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <link rel="manifest" href="/site.webmanifest">
  <title>OpenCode</title>
  <style>
    :root { color-scheme: dark; --bg:#212121; --panel:#171717; --panel2:#2f2f2f; --line:#3b3b3b; --muted:#a0a0a0; --text:#ececec; --accent:#10a37f; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; background:var(--bg); color:var(--text); font:14px system-ui,-apple-system,Segoe UI,sans-serif; }
    button,input,textarea { font:inherit; }
    button { border:0; cursor:pointer; color:inherit; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .app { display:flex; height:100%; overflow:hidden; }
    .sidebar { width:310px; flex:0 0 310px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
    .side-top { padding:12px; display:flex; gap:8px; }
    .new { min-width:0; background:var(--accent); color:#fff; border-radius:8px; padding:10px 12px; flex:1; display:flex; align-items:center; gap:7px; text-align:left; }
    .icon { background:transparent; color:var(--muted); font-size:22px; padding:4px 8px; border-radius:7px; }
    .new svg,.icon svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .icon:hover,.new:hover { filter:brightness(1.15); }
    .search { margin:0 12px 10px; width:calc(100% - 24px); background:#252525; border:1px solid var(--line); color:var(--text); border-radius:7px; padding:9px 10px; outline:none; }
    .search:focus { border-color:#777; }
    .sessions { overflow:auto; flex:1; padding:0 8px 12px; }
    .group { margin:10px 4px 4px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
    .project { margin:12px 4px 5px; color:#c7c7c7; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .session { display:flex; align-items:center; border-radius:7px; }
    .session:hover,.session.active { background:var(--panel2); }
    .session-main { min-width:0; flex:1; text-align:left; background:transparent; padding:9px 10px; }
    .session-delete { flex:0 0 34px; align-self:stretch; background:transparent; color:var(--muted); border-radius:7px; font-size:18px; }
    .session-delete:hover { color:#ff8d86; background:#442522; }
    .session-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .session-meta { color:var(--muted); font-size:11px; margin-top:3px; }
    .empty,.loading { color:var(--muted); padding:16px 10px; }
    .main { min-width:0; flex:1; display:flex; flex-direction:column; }
    .header { height:56px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); padding:0 18px; }
    .menu { display:none; }
    .header-title { min-width:0; flex:1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .status { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
    .stop-btn { display:flex; align-items:center; gap:6px; height:32px; padding:0 12px; background:#3a2323; color:#ffb4b4; border:1px solid #5a2a2a; border-radius:8px; font-size:13px; white-space:nowrap; }
    .stop-btn:hover { background:#4a2a2a; color:#fff; }
    .stop-btn[hidden] { display:none; }
    .stop-btn svg { width:14px; height:14px; fill:currentColor; }
    .messages { flex:1; overflow:auto; padding:24px max(18px, calc((100% - 820px)/2)); }
    .welcome { height:100%; display:grid; place-items:center; color:var(--muted); text-align:center; }
    .message { display:flex; gap:14px; margin:0 auto 24px; max-width:820px; line-height:1.55; }
    .avatar { flex:0 0 30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:12px; background:#555; }
    .message.user .avatar { background:#6b46c1; }
    .message.assistant .avatar { background:var(--accent); }
    .message-text { min-width:0; flex:1; white-space:pre-wrap; overflow-wrap:anywhere; }
    .trace { margin:0 0 10px; color:#c8c8c8; white-space:normal; }
    .trace-summary,.tool-summary { display:flex; align-items:center; gap:7px; cursor:pointer; list-style:none; color:var(--muted); user-select:none; }
    .trace-summary::-webkit-details-marker,.tool-summary::-webkit-details-marker { display:none; }
    .trace-summary:hover,.tool-summary:hover { color:var(--text); }
    .trace-chevron { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; transition:transform .15s ease; }
    details[open] > summary .trace-chevron { transform:rotate(90deg); }
    .live-pulse { width:7px; height:7px; flex:0 0 7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 0 #10a37f80; animation:pulse 1.25s infinite; }
    @keyframes pulse { 70% { box-shadow:0 0 0 7px #10a37f00; } 100% { box-shadow:0 0 0 0 #10a37f00; } }
    .trace-content { margin:9px 0 0 7px; padding-left:13px; border-left:1px solid #454545; display:flex; flex-direction:column; gap:9px; }
    .reasoning-part { color:#bdbdbd; white-space:pre-wrap; }
    .tool { border:1px solid #404040; border-radius:8px; background:#282828; overflow:hidden; }
    .tool-summary { min-height:34px; padding:6px 9px; }
    .tool-name { color:#d7d7d7; font-weight:550; }
    .tool-status { margin-left:auto; font-size:11px; color:var(--muted); }
    .tool.error .tool-status { color:#ff8d86; }
    .tool-data { padding:0 10px 10px; }
    .tool-label { margin:7px 0 4px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
    .tool-data pre { max-height:320px; margin:0; overflow:auto; padding:8px; border-radius:6px; background:#1d1d1d; color:#bebebe; font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
    .assistant-text + .assistant-text { margin-top:10px; }
    .composer { border-top:1px solid var(--line); padding:10px max(18px, calc((100% - 820px)/2)) 14px; }
    .controls { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:8px; min-height:32px; overflow-x:auto; }
    .mode-group { height:32px; display:flex; padding:3px; gap:2px; background:#292929; border:1px solid var(--line); border-radius:8px; }
    .mode-group:empty { display:none; }
    .mode { height:24px; background:transparent; color:var(--muted); border-radius:5px; padding:0 9px; white-space:nowrap; }
    .mode.active { color:var(--text); background:#3a3a3a; }
    .control { width:160px; height:32px; display:flex; align-items:center; justify-content:center; gap:6px; background:#292929; color:#d5d5d5; border:1px solid var(--line); border-radius:8px; padding:0 10px; white-space:nowrap; }
    .control:hover { background:#343434; }
    #modelButton { line-height:1; }
    .model-name { overflow:hidden; text-overflow:ellipsis; }
    .model-chevron { flex:0 0 16px; width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .select-control { position:relative; padding:0; }
    .select-control select { width:100%; height:100%; appearance:none; background:transparent; color:inherit; border:0; outline:0; cursor:pointer; padding:0 32px 0 12px; text-align:center; text-align-last:center; }
    .select-control .model-chevron { position:absolute; right:10px; pointer-events:none; }
    .select-control:has(select:disabled) { opacity:.45; pointer-events:none; }
    .form { display:flex; gap:8px; align-items:flex-end; background:#2f2f2f; border:1px solid #505050; border-radius:12px; padding:8px; }
    .attach { flex:0 0 40px; width:40px; height:40px; display:grid; place-items:center; background:transparent; color:#c9c9c9; border-radius:8px; }
    .attach:hover { background:#424242; color:white; }
    .attach svg,.send svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .attachments { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px; }
    .attachments[hidden] { display:none; }
    .attachment { max-width:280px; display:flex; align-items:center; gap:7px; padding:6px 8px 6px 10px; background:#303030; border:1px solid var(--line); border-radius:8px; }
    .attachment-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .attachment-remove { flex:0 0 22px; width:22px; height:22px; background:transparent; color:var(--muted); border-radius:5px; font-size:17px; line-height:1; }
    .attachment-remove:hover { background:#4a3030; color:#ff9b95; }
    textarea { resize:none; min-height:42px; max-height:180px; flex:1; background:transparent; color:var(--text); border:0; outline:0; padding:9px 8px; }
    .send { flex:0 0 40px; width:40px; height:40px; display:grid; place-items:center; background:var(--accent); color:white; border-radius:8px; }
    .send:disabled { opacity:.45; cursor:not-allowed; }
    .send[hidden] { display:none; }
    .stop { flex:0 0 40px; width:40px; height:40px; display:grid; place-items:center; background:#3a2323; color:#ffb4b4; border:1px solid #5a2a2a; border-radius:8px; }
    .stop:hover { background:#4a2a2a; color:#fff; }
    .stop[hidden] { display:none; }
    .stop:disabled { opacity:.45; cursor:not-allowed; }
    .stop svg { width:18px; height:18px; fill:currentColor; }
    dialog { width:min(560px,calc(100% - 24px)); padding:0; color:var(--text); background:#202020; border:1px solid #484848; border-radius:12px; box-shadow:0 24px 80px #000b; }
    dialog::backdrop { background:#0009; backdrop-filter:blur(2px); }
    .modal { padding:16px; }
    .modal-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .modal-title { flex:1; font-size:16px; font-weight:600; }
    .modal-close { background:transparent; color:var(--muted); font-size:22px; border-radius:6px; width:32px; height:32px; }
    .modal-close:hover { background:#333; color:var(--text); }
    .choice-search { width:100%; margin-bottom:10px; background:#292929; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:10px; outline:0; }
    .choice-list { max-height:min(60vh,520px); overflow:auto; display:flex; flex-direction:column; gap:4px; }
    .provider-group { display:flex; flex-direction:column; gap:4px; }
    .provider-heading { position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:7px; padding:9px 10px 5px; color:#dedede; background:#202020; font-size:12px; font-weight:650; cursor:pointer; user-select:none; }
    .provider-heading.collapsed { opacity:.85; }
    .provider-id { color:var(--muted); font-size:10px; font-weight:400; }
    .collapse-arrow { width:12px; height:12px; flex:0 0 12px; fill:none; stroke:currentColor; stroke-width:2; transition:transform .15s; }
    .provider-heading.collapsed .collapse-arrow { transform:rotate(-90deg); }
    .provider-count { margin-left:auto; color:var(--muted); font-size:11px; font-weight:400; }
    .model-row { display:flex; align-items:center; gap:6px; }
    .model-row .choice { flex:1; min-width:0; }
    .star { flex:0 0 28px; width:28px; height:28px; display:grid; place-items:center; background:transparent; color:#6a6a6a; border-radius:6px; font-size:16px; line-height:1; cursor:pointer; border:1px solid transparent; }
    .star:hover { background:#2e2e2e; color:#ddd; }
    .star.favorited { color:#f5c518; }
    .star:active { transform:scale(0.92); }
    .choice { width:100%; display:block; text-align:left; padding:10px 12px; background:transparent; border-radius:8px; }
    .choice:hover,.choice.active { background:#333; }
    .choice.favorited { background:#2a2a1a; border:1px solid #4a4a1a; }
    .choice-title { font-weight:500; display:flex; align-items:center; gap:6px; }
    .choice-meta { margin-top:3px; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
    .fav-heading { color:#f5c518; }
    .modal-text { color:#c7c7c7; line-height:1.45; margin:4px 0 18px; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; }
    .modal-button { border-radius:8px; padding:9px 14px; background:#353535; }
    .modal-button.danger { background:#9f332c; color:white; }
    .permission-banner { display:flex; align-items:center; gap:12px; margin:0 max(18px, calc((100% - 820px)/2)) 10px; padding:12px 14px; background:#2a2a1a; border:1px solid #6b6b2a; border-radius:10px; }
    .permission-banner[hidden] { display:none; }
    .permission-icon { flex:0 0 28px; width:28px; height:28px; display:grid; place-items:center; background:#6b6b2a; color:#fff; border-radius:50%; font-size:16px; }
    .permission-text { flex:1; min-width:0; }
    .permission-title { font-weight:600; color:#f0e6a0; }
    .permission-detail { color:#c9c9a0; font-size:12px; margin-top:3px; overflow-wrap:anywhere; }
    .permission-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .permission-actions .modal-button { padding:8px 12px; font-size:13px; white-space:nowrap; }
    .permission-actions .modal-button.primary { background:var(--accent); color:#fff; }
    /* Pull-to-refresh (вверх и вниз) — с явной анимацией */
    .messages { position:relative; overscroll-behavior-y:contain; }
    #messagesInner { transition:transform .22s ease; will-change:transform; }
    .pull-indicator { position:absolute; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:10px; height:0; overflow:hidden; color:var(--muted); font-size:14px; font-weight:500; background:var(--panel); border:0 solid var(--line); transition:height .22s ease, opacity .2s ease, background .2s; opacity:0; z-index:2; pointer-events:none; }
    .pull-indicator.top { top:0; border-bottom-width:1px; }
    .pull-indicator.bottom { top:auto; bottom:0; border-top-width:1px; }
    .pull-indicator.active { opacity:1; }
    .pull-indicator.ready { color:var(--text); background:#1e2b28; border-color:var(--accent); }
    .pull-indicator.done { color:var(--text); background:#1a3329; }
    .pull-indicator .pull-spinner { width:22px; height:22px; flex:0 0 22px; border:2.5px solid #3a3a3a; border-top-color:var(--accent); border-radius:50%; animation:none; }
    .pull-indicator.ready .pull-spinner { animation:pullspin .55s linear infinite; }
    .pull-indicator.done .pull-spinner { border-color:var(--accent); border-top-color:var(--accent); animation:none; }
    .pull-indicator.done .pull-spinner::after { content:'✓'; display:grid; place-items:center; font-size:14px; color:var(--accent); }
    @keyframes pullspin { to { transform:rotate(360deg); } }
    @media (max-width:760px) {
      .sidebar { position:fixed; z-index:3; inset:0 auto 0 0; transform:translateX(-100%); transition:transform .18s ease; box-shadow:8px 0 30px #0008; }
      .sidebar.open { transform:none; }
      .menu { display:block; }
      .header { padding:0 10px; }
      .messages { padding:18px 12px; }
      .composer { padding:10px 12px; }
      .controls { flex-wrap:wrap; overflow:visible; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-top"><button class="new" id="newSession"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Новая сессия</button><button class="icon" id="chooseProject" title="Создать в проекте" aria-label="Создать в проекте"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v10H3z"/></svg></button><button class="icon" id="refresh" title="Обновить" aria-label="Обновить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg></button></div>
      <input class="search" id="search" placeholder="Поиск сессий…" autocomplete="off">
      <div class="sessions" id="sessions"><div class="loading">Загрузка сессий…</div></div>
    </aside>
    <main class="main">
      <header class="header"><button class="icon menu" id="menu">☰</button><div class="header-title" id="headerTitle">OpenCode</div><div class="status" id="status"></div><button class="stop-btn" id="stopBtn" hidden title="Остановить агента (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg> Стоп</button></header>
      <section class="messages" id="messages"><div class="pull-indicator top" id="pullIndicator"><div class="pull-spinner"></div><span class="pull-text">Потяни вниз для обновления</span></div><div class="pull-indicator bottom" id="pullIndicatorBottom"><div class="pull-spinner"></div><span class="pull-text">Потяни вверх для обновления</span></div><div id="messagesInner"><div class="welcome">Задай быстрый вопрос ниже<br>или выбери сессию слева.</div></div></section>
      <div class="permission-banner" id="permissionBanner" hidden><div class="permission-icon">!</div><div class="permission-text"><div class="permission-title" id="permissionBannerTitle">Требуется разрешение</div><div class="permission-detail" id="permissionBannerDetail"></div></div><div class="permission-actions"><button class="modal-button" id="bannerReject">Отклонить</button><button class="modal-button primary" id="bannerOnce">Разрешить</button><button class="modal-button" id="bannerAlways">Всегда</button></div></div>
      <div class="composer">
        <div class="controls"><div class="mode-group" id="agentControls"></div><button class="control" id="modelButton" disabled><span class="model-name">Модель</span><svg class="model-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg></button><label class="control select-control"><select id="variantSelect" title="Effort" disabled><option>Effort</option></select><svg class="model-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg></label></div>
        <div class="attachments" id="attachments" hidden></div>
        <form class="form" id="form"><button class="attach" id="attachButton" type="button" aria-label="Добавить файл" title="Добавить файл"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><input id="fileInput" type="file" multiple hidden><textarea id="input" rows="1" placeholder="Быстрый вопрос или сообщение…"></textarea><button class="send" id="send" type="submit" aria-label="Отправить" title="Отправить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button><button class="stop" id="formStop" type="button" hidden aria-label="Остановить" title="Остановить (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg></button></form>
      </div>
    </main>
  </div>
  <dialog id="projectDialog"><div class="modal"><div class="modal-head"><div class="modal-title">Выбрать проект</div><button class="modal-close" data-close="projectDialog" aria-label="Закрыть">×</button></div><div class="choice-list" id="projectChoices"></div></div></dialog>
  <dialog id="modelDialog"><div class="modal"><div class="modal-head"><div class="modal-title">Выбрать модель</div><button class="modal-close" data-close="modelDialog" aria-label="Закрыть">×</button></div><input class="choice-search" id="modelSearch" placeholder="Поиск модели…" autocomplete="off"><div class="choice-list" id="modelChoices"></div></div></dialog>
  <dialog id="deleteDialog"><div class="modal"><div class="modal-head"><div class="modal-title">Удалить сессию?</div><button class="modal-close" data-close="deleteDialog" aria-label="Закрыть">×</button></div><div class="modal-text" id="deleteText"></div><div class="modal-actions"><button class="modal-button" data-close="deleteDialog">Отмена</button><button class="modal-button danger" id="confirmDelete">Удалить</button></div></div></dialog>
  <dialog id="permissionDialog"><div class="modal"><div class="modal-head"><div class="modal-title">Требуется разрешение</div><button class="modal-close" data-close="permissionDialog" aria-label="Закрыть">×</button></div><div class="modal-text" id="permissionText"></div><div class="modal-actions"><button class="modal-button" id="permissionReject">Отклонить</button><button class="modal-button primary" id="permissionOnce">Разрешить</button><button class="modal-button" id="permissionAlways">Всегда разрешать</button></div></div></dialog>
  <script>
    const state = { sessions: [], projects: [], selected: null, context: [], agents: [], models: [], providers: [], defaultModel: null, draftAgent: null, draftModel: null, attachments: [], pendingDelete: null, busy: false, loading: false }
    let SCRATCH_DIRECTORY
    const $ = (id) => document.getElementById(id)
    const api = async (path, options = {}) => {
      const response = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } })
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`)
      return response.status === 204 ? null : response.json()
    }
    async function loadClientConfig() {
      const config = await api('/client-config.json')
      SCRATCH_DIRECTORY = config.scratchDirectory
    }
    const projectMap = () => new Map(state.projects.map((project) => [project.id, project]))
    const projectLabel = (project) => project?.name || project?.canonical?.split('/').filter(Boolean).pop() || project?.id || 'Без проекта'
    const projectName = (session) => {
      const project = projectMap().get(session.projectID)
      const directory = session.location?.directory || project?.canonical || 'Без проекта'
      return project ? projectLabel(project) : directory.split('/').filter(Boolean).pop() || directory
    }
    const directory = (session) => session.location?.directory || projectMap().get(session.projectID)?.canonical || ''
    const sessionTitle = (session) => session.title?.trim() || 'Без названия'
    const sessionTime = (session) => session.time?.updated || session.time?.created || 0
    const timeText = (value) => value ? new Date(value).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : ''

    async function loadSessions() {
      state.loading = true
      renderSessions()
      try {
        const [projects, first] = await Promise.all([api('/api/project'), api('/api/session?limit=100&order=desc')])
        state.projects = Array.isArray(projects) ? projects : []
        const sessions = [...(first.data || [])]
        let cursor = first.cursor?.next
        let pages = 0
        while (cursor && pages++ < 200) {
          const page = await api(`/api/session?limit=100&cursor=${encodeURIComponent(cursor)}`)
          sessions.push(...(page.data || []))
          cursor = page.cursor?.next
        }
        const unique = new Map(sessions.map((session) => [session.id, session]))
        state.sessions = [...unique.values()].sort((a, b) => sessionTime(b) - sessionTime(a))
        if (state.selected) state.selected = state.sessions.find((item) => item.id === state.selected.id) || state.selected
        state.loading = false
        renderSessions()
        if (state.selected) renderHeader()
        $('status').textContent = `${state.sessions.length} сессий`
      } catch (error) {
        $('sessions').innerHTML = `<div class="empty">Не удалось загрузить сессии.<br>${error.message}</div>`
        $('status').textContent = 'Ошибка'
      } finally {
        state.loading = false
      }
    }

    function renderSessions() {
      if (state.loading) { $('sessions').innerHTML = '<div class="loading">Загрузка сессий…</div>'; return }
      const query = $('search').value.trim().toLowerCase()
      const visible = state.sessions.filter((session) => `${sessionTitle(session)} ${projectName(session)} ${directory(session)}`.toLowerCase().includes(query))
      if (!visible.length) { $('sessions').innerHTML = '<div class="empty">Сессий не найдено.</div>'; return }
      const groups = new Map()
      for (const session of visible) {
        const key = projectName(session)
        if (!groups.has(key)) groups.set(key, [])
        groups.get(key).push(session)
      }
      $('sessions').innerHTML = [...groups].map(([name, items]) => `
        <div class="project" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
        ${items.map((session) => `<div class="session ${state.selected?.id === session.id ? 'active' : ''}">
          <button class="session-main" data-session="${session.id}"><div class="session-title">${escapeHtml(sessionTitle(session))}</div><div class="session-meta">${timeText(sessionTime(session))}</div></button>
          <button class="session-delete" data-delete="${session.id}" aria-label="Удалить сессию" title="Удалить">×</button>
        </div>`).join('')}`).join('')
      document.querySelectorAll('[data-session]').forEach((button) => button.addEventListener('click', () => selectSession(button.dataset.session)))
      document.querySelectorAll('[data-delete]').forEach((button) => button.addEventListener('click', () => askDelete(button.dataset.delete)))
    }

    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]) }
    function renderHeader() { $('headerTitle').textContent = state.selected ? sessionTitle(state.selected) : 'OpenCode' }

    const activeModelRef = () => state.selected?.model || (!state.selected && state.draftModel) || (state.defaultModel && { id:state.defaultModel.id, providerID:state.defaultModel.providerID })
    const activeModel = () => {
      const ref = activeModelRef()
      return ref && state.models.find((model) => model.id === ref.id && model.providerID === ref.providerID)
    }

    async function fetchControls(location) {
      const params = new URLSearchParams({ 'location[directory]': location })
      const [agents, models, providers, fallback] = await Promise.all([
        api(`/api/agent?${params}`), api(`/api/model?${params}`), api(`/api/provider?${params}`), api(`/api/model/default?${params}`),
      ])
      return {
        agents:(agents.data || []).filter((agent) => !agent.hidden && (agent.mode === 'primary' || agent.mode === 'all')),
        models:(models.data || []).filter((model) => model.enabled),
        providers:providers.data || [],
        fallback:fallback.data,
      }
    }

    function applyControls(catalog) {
      state.agents = catalog.agents
      state.models = catalog.models
      state.providers = catalog.providers
      state.defaultModel = catalog.fallback
      renderControls()
    }

    async function loadControls() {
      if (!state.selected) return
      const sessionID = state.selected.id
      try {
        const catalog = await fetchControls(directory(state.selected))
        if (state.selected?.id !== sessionID) return
        applyControls(catalog)
      } catch (error) { $('status').textContent = `Настройки недоступны: ${error.message}` }
    }

    async function loadDraftControls() {
      try {
        const catalog = await fetchControls(SCRATCH_DIRECTORY)
        if (state.selected) return
        state.draftAgent ||= catalog.agents.find((agent) => agent.id === 'build')?.id || catalog.agents[0]?.id
        state.draftModel ||= catalog.fallback && { id:catalog.fallback.id, providerID:catalog.fallback.providerID }
        applyControls(catalog)
      } catch (error) { $('status').textContent = `Настройки недоступны: ${error.message}` }
    }

    function renderControls() {
      const fallbackAgent = state.agents.find((agent) => agent.id === 'build')?.id || state.agents[0]?.id
      const agentID = state.selected?.agent || (!state.selected && state.draftAgent) || fallbackAgent
      $('agentControls').innerHTML = state.agents.map((agent) => `<button class="mode ${agent.id === agentID ? 'active' : ''}" data-agent="${escapeHtml(agent.id)}">${escapeHtml(agent.name)}</button>`).join('')
      document.querySelectorAll('[data-agent]').forEach((button) => button.addEventListener('click', () => changeAgent(button.dataset.agent)))

      const ref = activeModelRef()
      const model = activeModel()
      $('modelButton').disabled = !state.models.length
      $('modelButton').innerHTML = `<span class="model-name">${escapeHtml(model?.name || ref?.id || 'Выбрать модель')}</span><svg class="model-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg>`
      const variants = model?.variants || []
      $('variantSelect').innerHTML = variants.length
        ? `<option value="">Effort: default</option>${variants.map((variant) => `<option value="${escapeHtml(variant.id)}">Effort: ${escapeHtml(variant.id)}</option>`).join('')}`
        : '<option value="">Effort: —</option>'
      $('variantSelect').value = ref?.variant || ''
      $('variantSelect').disabled = !model || !variants.length
    }

    async function changeAgent(agent) {
      state.draftAgent = agent
      if (!state.selected) { renderControls(); return }
      if (state.selected.agent === agent) return
      const session = state.selected
      try {
        await api(`/api/session/${encodeURIComponent(session.id)}/agent`, { method:'POST', body:JSON.stringify({ agent }) })
        session.agent = agent
        renderControls()
      } catch (error) { $('status').textContent = `Не удалось сменить режим: ${error.message}` }
    }

    async function changeModel(model) {
      state.draftModel = model
      if (!state.selected) { renderControls(); return }
      const session = state.selected
      try {
        await api(`/api/session/${encodeURIComponent(session.id)}/model`, { method:'POST', body:JSON.stringify({ model }) })
        session.model = model
        renderControls()
      } catch (error) { $('status').textContent = `Не удалось сменить модель: ${error.message}` }
    }

    function openModelDialog() {
      $('modelSearch').value = ''
      renderModelChoices()
      $('modelDialog').showModal()
      $('modelSearch').focus()
    }

    // --- favorites & sorting ---
    const FAV_KEY = 'opencode:web:favorites'
    const COLLAPSED_KEY = 'opencode:web:collapsedGroups'
    const loadFavorites = () => { try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')) } catch { return new Set() } }
    const saveFavorites = (set) => localStorage.setItem(FAV_KEY, JSON.stringify([...set]))
    const loadCollapsed = () => { try { return JSON.parse(localStorage.getItem(COLLAPSED_KEY) || '{}') } catch { return {} } }
    const saveCollapsed = (obj) => localStorage.setItem(COLLAPSED_KEY, JSON.stringify(obj))
    const favKey = (m) => `${m.providerID}/${m.id}`
    const isFree = (m) => {
      if (m.id.toLowerCase().includes('-free') || m.id.toLowerCase().endsWith(':free')) return true
      const c = m.cost && m.cost[0]
      return c && c.input === 0 && c.output === 0
    }
    const modelRank = (m) => {
      if (m.providerID === 'openai') return 0
      if (m.providerID === 'ollama') return 3
      if (m.family === 'qwen' || m.providerID === 'bailian-cli' || m.id.toLowerCase().includes('qwen')) return 1
      if (isFree(m)) return 2
      return 4
    }
    let favorites = loadFavorites()
    let collapsedGroups = loadCollapsed()
    function toggleFavorite(model) {
      const key = favKey(model)
      if (favorites.has(key)) favorites.delete(key)
      else favorites.add(key)
      saveFavorites(favorites)
      renderModelChoices()
    }
    function toggleGroup(providerID) {
      collapsedGroups[providerID] = !collapsedGroups[providerID]
      saveCollapsed(collapsedGroups)
      renderModelChoices()
      // keep scroll position
    }
    function renderModelChoices() {
      const query = $('modelSearch').value.trim().toLowerCase()
      const current = activeModelRef()
      const allFiltered = state.models.filter((model) => `${model.name} ${model.id} ${model.providerID}`.toLowerCase().includes(query))
      const providerName = (id) => state.providers.find((provider) => provider.id === id)?.name || id
      // favorites that match query
      const favModels = allFiltered.filter((m) => favorites.has(favKey(m)))
      const favSet = new Set(favModels.map(favKey))
      // group remaining by provider
      const groups = new Map()
      for (const model of allFiltered) {
        if (favSet.has(favKey(model))) continue
        if (!groups.has(model.providerID)) groups.set(model.providerID, [])
        groups.get(model.providerID).push(model)
      }
      // sort models inside each group
      for (const [, items] of groups) {
        items.sort((a,b) => modelRank(a) - modelRank(b) || a.name.localeCompare(b.name))
      }
      favModels.sort((a,b) => modelRank(a) - modelRank(b) || a.name.localeCompare(b.name))
      // sort groups by rank of their best model
      const sortedGroups = [...groups.entries()].sort((a,b) => {
        const ra = Math.min(...a[1].map(modelRank))
        const rb = Math.min(...b[1].map(modelRank))
        if (ra !== rb) return ra - rb
        return providerName(a[0]).localeCompare(providerName(b[0]))
      })
      const isCollapsed = (id) => !!collapsedGroups[id]
      const starBtn = (model, active) => `<button class="star ${favorites.has(favKey(model)) ? 'favorited' : ''}" data-star="${escapeHtml(model.providerID)}/${escapeHtml(model.id)}" title="Избранное (долгое нажатие)">${favorites.has(favKey(model)) ? '★' : '☆'}</button>`
      const modelButton = (model) => {
        const active = current?.id === model.id && current?.providerID === model.providerID
        const fav = favorites.has(favKey(model))
        return `<div class="model-row"><button class="choice ${active ? 'active' : ''} ${fav ? 'favorited' : ''}" data-model="${escapeHtml(model.id)}" data-provider="${escapeHtml(model.providerID)}"><div class="choice-title">${escapeHtml(model.name)}${fav ? ' <span style="color:#f5c518">★</span>' : ''}</div><div class="choice-meta">${escapeHtml(model.id)}</div></button>${starBtn(model, active)}</div>`
      }
      const favSection = favModels.length ? `<section class="provider-group" data-group="__fav"><div class="provider-heading" data-toggle="__fav"><svg class="collapse-arrow" viewBox="0 0 12 12"><path d="M2 4 L6 8 L10 4"/></svg><span class="fav-heading">★ Избранное</span><span class="provider-count">${favModels.length}</span></div><div class="provider-body" ${isCollapsed('__fav') ? 'hidden' : ''}>${favModels.map(modelButton).join('')}</div></section>` : ''
      const groupsHtml = sortedGroups.map(([providerID, items]) => {
        const collapsed = isCollapsed(providerID)
        return `<section class="provider-group" data-group="${escapeHtml(providerID)}"><div class="provider-heading ${collapsed ? 'collapsed' : ''}" data-toggle="${escapeHtml(providerID)}"><svg class="collapse-arrow" viewBox="0 0 12 12"><path d="M2 4 L6 8 L10 4"/></svg>${escapeHtml(providerName(providerID))}<span class="provider-id">${escapeHtml(providerID)}</span><span class="provider-count">${items.length}</span></div><div class="provider-body" ${collapsed ? 'hidden' : ''}>${items.map(modelButton).join('')}</div></section>`
      }).join('')
      const html = favSection + groupsHtml
      $('modelChoices').innerHTML = html || '<div class="empty">Модели не найдены.</div>'
      // toggle handlers
      document.querySelectorAll('[data-toggle]').forEach((el) => el.addEventListener('click', () => toggleGroup(el.dataset.toggle)))
      // model select
      document.querySelectorAll('[data-model]').forEach((button) => {
        button.addEventListener('click', () => {
          $('modelDialog').close()
          changeModel({ id:button.dataset.model, providerID:button.dataset.provider })
        })
        // long press to favorite
        let timer = null, moved = false
        const model = { id: button.dataset.model, providerID: button.dataset.provider }
        // find full object for fav toggle? need to lookup
        const full = state.models.find((m) => m.id === model.id && m.providerID === model.providerID)
        const start = (e) => { moved=false; timer=setTimeout(()=>{ if(!moved && full) toggleFavorite(full) }, 600) }
        const cancel = () => { clearTimeout(timer) }
        const checkMove = (e) => { moved=true }
        button.addEventListener('touchstart', start, {passive:true})
        button.addEventListener('touchmove', checkMove, {passive:true})
        button.addEventListener('touchend', cancel)
        button.addEventListener('mousedown', start)
        button.addEventListener('mousemove', checkMove)
        button.addEventListener('mouseup', cancel)
        button.addEventListener('mouseleave', cancel)
      })
      document.querySelectorAll('[data-star]').forEach((btn) => btn.addEventListener('click', (e) => {
        e.stopPropagation()
        const [providerID, ...rest] = btn.dataset.star.split('/')
        const id = rest.join('/')
        const full = state.models.find((m) => m.providerID===providerID && m.id===id)
        if (full) toggleFavorite(full)
      }))
    }

    async function selectSession(id, preserveAttachments = false) {
      const session = state.sessions.find((item) => item.id === id)
      if (!session) return
      if (state.selected?.id !== id && !preserveAttachments) { state.attachments = []; renderAttachments() }
      state.selected = session
      state.agents = []; state.models = []; state.providers = []; state.defaultModel = null
      renderSessions(); renderHeader()
      renderControls()
      $('input').disabled = false; $('attachButton').disabled = false; $('send').disabled = state.busy
      $('sidebar').classList.remove('open')
      await Promise.all([loadContext(), loadControls()])
    }

    function updateStopBtn() {
      const headerBtn = $('stopBtn')
      const formStop = $('formStop')
      const send = $('send')
      const busy = state.busy && !!state.selected
      if (headerBtn) headerBtn.hidden = true // теперь стоп только вместо «отправить» в форме
      if (formStop) formStop.hidden = !busy
      if (send) send.hidden = !!busy
    }
    function setStatus(text, live = false) {
      $('status').innerHTML = `${live ? '<span class="live-pulse"></span>' : ''}${escapeHtml(text)}`
      updateStopBtn()
    }
    async function interruptSession() {
      if (!state.selected || !state.busy) return
      const headerBtn = $('stopBtn')
      const formStop = $('formStop')
      const prevHeader = headerBtn ? headerBtn.innerHTML : ''
      const prevForm = formStop ? formStop.innerHTML : ''
      if (headerBtn) { headerBtn.disabled = true; headerBtn.innerHTML = ' …' }
      if (formStop) { formStop.disabled = true; formStop.innerHTML = '…' }
      try {
        await api(`/api/session/${encodeURIComponent(state.selected.id)}/interrupt`, { method: 'POST', body: JSON.stringify({}) })
        setStatus('Останавливаю…', true)
      } catch (error) {
        setStatus(`Не удалось остановить: ${error.message}`)
      } finally {
        if (headerBtn) { headerBtn.disabled = false; headerBtn.innerHTML = prevHeader || '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg> Стоп' }
        if (formStop) { formStop.disabled = false; formStop.innerHTML = prevForm || '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>' }
        updateStopBtn()
      }
    }

    async function loadContext() {
      if (!state.selected) return
      const sessionID = state.selected.id
      try {
        const result = await api(`/api/session/${encodeURIComponent(sessionID)}/context`)
        if (state.selected?.id !== sessionID) return
        state.context = (result.data || []).filter((message) => message.type === 'user' || message.type === 'assistant')
        renderMessages()
      } catch (error) {
        if (state.selected?.id !== sessionID) return
        $('messagesInner').innerHTML = `<div class="empty">Не удалось открыть сессию: ${escapeHtml(error.message)}</div>`
      }
    }

    function clipped(value) {
      if (value === undefined || value === null) return ''
      let text
      try { text = typeof value === 'string' ? value : JSON.stringify(value, null, 2) }
      catch { text = String(value) }
      if (text === '{}' || text === '[]') return ''
      // ponytail: tool payloads are capped to keep long sessions responsive; add lazy loading if full output becomes necessary.
      return text.length > 12000 ? `${text.slice(0, 12000)}\n\n…обрезано…` : text
    }

    const detailChevron = '<svg class="trace-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>'
    const toolStatus = (status) => ({ streaming:'подготовка', running:'выполняется', completed:'готово', error:'ошибка' })[status] || status || 'ожидание'

    function renderTool(part, open) {
      const key = `tool:${part.id}`
      const status = part.state?.status || 'running'
      const input = clipped(part.state?.input)
      const output = clipped((part.state?.content || []).map((item) => item.type === 'text' ? item.text : `[Файл] ${item.name || item.uri}`).join('\n'))
      const error = clipped(part.state?.error?.message || part.state?.error)
      const body = `${input ? `<div class="tool-label">Вход</div><pre>${escapeHtml(input)}</pre>` : ''}${output ? `<div class="tool-label">Результат</div><pre>${escapeHtml(output)}</pre>` : ''}${error ? `<div class="tool-label">Ошибка</div><pre>${escapeHtml(error)}</pre>` : ''}`
      return `<details class="tool ${status === 'error' ? 'error' : ''}" data-detail="${escapeHtml(key)}" ${open.has(key) ? 'open' : ''}><summary class="tool-summary">${detailChevron}<span class="tool-name">${escapeHtml(part.name || 'tool')}</span>${status === 'running' || status === 'streaming' ? '<span class="live-pulse"></span>' : ''}<span class="tool-status">${escapeHtml(toolStatus(status))}</span></summary>${body ? `<div class="tool-data">${body}</div>` : ''}</details>`
    }

    function renderAssistant(message, open, active) {
      const parts = message.content || []
      const reasoning = parts.filter((part) => part.type === 'reasoning' && part.text)
      const tools = parts.filter((part) => part.type === 'tool')
      const texts = parts.filter((part) => part.type === 'text' && part.text)
      const runningTool = tools.findLast((part) => ['streaming','running'].includes(part.state?.status))
      const traceKey = `trace:${message.id}`
      const label = runningTool ? `${runningTool.name}: ${toolStatus(runningTool.state?.status)}` : active ? 'Рассуждает…' : `Ход рассуждения${tools.length ? ` · инструментов: ${tools.length}` : ''}`
      const traceBody = `${reasoning.map((part) => `<div class="reasoning-part">${escapeHtml(part.text)}</div>`).join('')}${tools.map((part) => renderTool(part, open)).join('')}${active && !reasoning.length && !tools.length ? '<div class="reasoning-part">Ожидание ответа…</div>' : ''}`
      const trace = reasoning.length || tools.length || active ? `<details class="trace" data-detail="${escapeHtml(traceKey)}" ${open.has(traceKey) ? 'open' : ''}><summary class="trace-summary">${detailChevron}${active ? '<span class="live-pulse"></span>' : ''}<span>${escapeHtml(label)}</span></summary><div class="trace-content">${traceBody}</div></details>` : ''
      const answer = texts.map((part) => `<div class="assistant-text">${escapeHtml(part.text)}</div>`).join('')
      const error = message.error?.message ? `<div class="assistant-text">Ошибка: ${escapeHtml(message.error.message)}</div>` : ''
      return trace + answer + error
    }

    function renderMessages() {
      const view = $('messages')
      const inner = $('messagesInner')
      if (!state.context.length) { inner.innerHTML = '<div class="welcome">Пока нет сообщений.<br>Напиши первое сообщение ниже.</div>'; return }
      const open = new Set([...view.querySelectorAll('details[open][data-detail]')].map((item) => item.dataset.detail))
      const stick = view.scrollHeight - view.scrollTop - view.clientHeight < 90
      const scrollTop = view.scrollTop
      const lastAssistant = state.context.findLast((message) => message.type === 'assistant')
      inner.innerHTML = state.context.map((message) => {
        if (message.type === 'user') {
          const files = (message.files || []).map((file) => `<div class="attachment"><span class="attachment-name">${escapeHtml(file.name || file.mime || 'файл')}</span></div>`).join('')
          return `<article class="message user"><div class="avatar">Я</div><div class="message-text">${escapeHtml(message.text || '')}${files ? `<div class="attachments">${files}</div>` : ''}</div></article>`
        }
        const body = renderAssistant(message, open, state.busy && message === lastAssistant && !message.time?.completed)
        return body ? `<article class="message assistant"><div class="avatar">AI</div><div class="message-text">${body}</div></article>` : ''
      }).join('')
      if (stick) view.scrollTop = view.scrollHeight
      else view.scrollTop = scrollTop
    }

    let renderTimer
    function scheduleMessages() {
      if (renderTimer) return
      renderTimer = setTimeout(() => { renderTimer = undefined; renderMessages() }, 100)
    }

    function ensureAssistant(id) {
      let message = state.context.find((item) => item.id === id)
      if (message) return message
      message = { id, type:'assistant', agent:state.selected?.agent || 'build', model:activeModelRef(), time:{ created:Date.now() }, content:[] }
      state.context.push(message)
      return message
    }

    function ensurePart(message, type, ordinal = 0) {
      let part = (message.content || []).filter((item) => item.type === type)[ordinal]
      if (part) return part
      part = { type, text:'' }
      message.content ||= []
      message.content.push(part)
      return part
    }

    function ensureTool(message, data) {
      let part = (message.content || []).find((item) => item.type === 'tool' && item.id === data.id)
      if (part) return part
      part = { type:'tool', id:data.id, name:data.name || 'tool', state:{ status:'streaming', input:'' }, time:{ created:Date.now() } }
      message.content ||= []
      message.content.push(part)
      return part
    }

    function finishExecution(type, data) {
      state.busy = false
      $('send').disabled = false
      setStatus(type === 'session.execution.failed' ? `Ошибка: ${data.error?.message || 'выполнение завершилось с ошибкой'}` : type === 'session.execution.interrupted' ? 'Остановлено' : 'Готово')
      updateStopBtn()
      scheduleMessages()
      loadContext()
      loadSessions()
    }

    function handleServerEvent(payload) {
      const data = payload.data || {}
      if (!state.selected || data.sessionID !== state.selected.id) return
      let message, part
      switch (payload.type) {
        case 'session.execution.started':
          state.busy = true; $('send').disabled = true; setStatus('Рассуждает…', true); updateStopBtn(); scheduleMessages(); break
        case 'session.step.started':
          ensureAssistant(data.assistantMessageID); scheduleMessages(); break
        case 'session.reasoning.started':
          ensurePart(ensureAssistant(data.assistantMessageID), 'reasoning', data.ordinal || 0); scheduleMessages(); break
        case 'session.reasoning.delta':
          part = ensurePart(ensureAssistant(data.assistantMessageID), 'reasoning', data.ordinal || 0); part.text += data.delta || ''; scheduleMessages(); break
        case 'session.reasoning.ended':
          part = ensurePart(ensureAssistant(data.assistantMessageID), 'reasoning', data.ordinal || 0); part.text = data.text || part.text; part.time = { ...(part.time || {}), completed:Date.now() }; scheduleMessages(); break
        case 'session.text.started':
          ensurePart(ensureAssistant(data.assistantMessageID), 'text', data.ordinal || 0); scheduleMessages(); break
        case 'session.text.delta':
          part = ensurePart(ensureAssistant(data.assistantMessageID), 'text', data.ordinal || 0); part.text += data.delta || ''; scheduleMessages(); break
        case 'session.text.ended':
          part = ensurePart(ensureAssistant(data.assistantMessageID), 'text', data.ordinal || 0); part.text = data.text || part.text; scheduleMessages(); break
        case 'session.tool.input.started':
          ensureTool(ensureAssistant(data.assistantMessageID), data); scheduleMessages(); break
        case 'session.tool.input.delta':
          part = ensureTool(ensureAssistant(data.assistantMessageID), data); part.state.input += data.delta || ''; scheduleMessages(); break
        case 'session.tool.called':
          part = ensureTool(ensureAssistant(data.assistantMessageID), data); part.state = { status:'running', input:data.input || {}, metadata:{} }; scheduleMessages(); break
        case 'session.tool.progress':
          part = ensureTool(ensureAssistant(data.assistantMessageID), data); part.state.metadata = data.metadata || {}; scheduleMessages(); break
        case 'session.tool.success':
          part = ensureTool(ensureAssistant(data.assistantMessageID), data); part.state = { status:'completed', input:part.state.input || data.input || {}, content:data.content || [], metadata:data.metadata || {} }; part.time.completed = Date.now(); scheduleMessages(); break
        case 'session.tool.failed':
          part = ensureTool(ensureAssistant(data.assistantMessageID), data); part.state = { status:'error', input:part.state.input || data.input || {}, error:data.error || { message:'Ошибка' }, content:data.content || [], metadata:data.metadata || {} }; part.time.completed = Date.now(); scheduleMessages(); break
        case 'session.step.ended':
          message = ensureAssistant(data.assistantMessageID); message.finish = data.finish; message.time.completed = Date.now(); scheduleMessages(); break
        case 'session.step.failed':
          message = ensureAssistant(data.assistantMessageID); message.error = data.error; message.time.completed = Date.now(); scheduleMessages(); break
        case 'session.inbox.delivered':
          loadContext(); break
        case 'session.execution.succeeded':
        case 'session.execution.interrupted':
        case 'session.execution.failed':
          finishExecution(payload.type, data); break
        case 'session.retry.scheduled':
          setStatus('Повтор запроса…', true); break
      }
    }

    function connectEvents() {
      const source = new EventSource('/api/event')
      source.onmessage = (event) => {
        try { handleServerEvent(JSON.parse(event.data)) }
        catch (error) { console.warn('Invalid OpenCode event', error) }
      }
      source.onerror = () => { if (state.busy) setStatus('Переподключение к потоку…', true) }
      window.addEventListener('beforeunload', () => source.close(), { once:true })
    }

    function readFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader()
        reader.onload = () => resolve({ uri:reader.result, name:file.name || `clipboard-${Date.now()}` })
        reader.onerror = () => reject(reader.error || new Error('Не удалось прочитать файл'))
        reader.readAsDataURL(file)
      })
    }

    async function addFiles(files) {
      try {
        state.attachments.push(...await Promise.all([...files].map(readFile)))
        renderAttachments()
      } catch (error) { $('status').textContent = `Не удалось добавить файл: ${error.message}` }
    }

    function renderAttachments() {
      $('attachments').hidden = !state.attachments.length
      $('attachments').innerHTML = state.attachments.map((file, index) => `<div class="attachment"><span class="attachment-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</span><button class="attachment-remove" data-remove-file="${index}" aria-label="Убрать файл">×</button></div>`).join('')
      document.querySelectorAll('[data-remove-file]').forEach((button) => button.addEventListener('click', () => {
        state.attachments.splice(Number(button.dataset.removeFile), 1)
        renderAttachments()
      }))
    }

    async function sendMessage(event) {
      event.preventDefault()
      const input = $('input')
      const text = input.value.trim()
      if ((!text && !state.attachments.length) || state.busy) return
      const files = state.attachments.map(({ uri, name }) => ({ uri, name }))
      input.value = ''; state.busy = true; $('send').disabled = true; setStatus('Отправка…', true)
      let accepted = false
      try {
        if (!state.selected) await createSessionAt(SCRATCH_DIRECTORY, undefined, true)
        await api(`/api/session/${encodeURIComponent(state.selected.id)}/prompt`, { method:'POST', body: JSON.stringify({ text, files, delivery:'steer' }) })
        accepted = true; state.attachments = []; renderAttachments()
        await loadContext()
        await api(`/api/session/${encodeURIComponent(state.selected.id)}/wait`, { method:'POST' })
        await loadContext()
        setStatus('Готово')
      } catch (error) {
        if (!accepted) input.value = text
        setStatus(`Ошибка: ${error.message}`)
      }
      state.busy = false; $('send').disabled = false; await loadSessions()
    }

    function openProjectDialog() {
      $('projectChoices').innerHTML = state.projects.map((project) => `<button class="choice" data-project="${escapeHtml(project.id)}"><div class="choice-title">${escapeHtml(projectLabel(project))}</div><div class="choice-meta">${escapeHtml(project.canonical || project.id)}</div></button>`).join('') || '<div class="empty">Проекты не найдены.</div>'
      document.querySelectorAll('[data-project]').forEach((button) => button.addEventListener('click', () => createSession(button.dataset.project)))
      $('projectDialog').showModal()
    }

    async function createSession(projectID) {
      const project = state.projects.find((item) => item.id === projectID)
      if (!project) return
      $('projectDialog').close()
      try {
        await createSessionAt(project.canonical, 'Новая сессия')
      } catch (error) { $('status').textContent = `Не удалось создать сессию: ${error.message}` }
    }

    async function createSessionAt(directory, title, preserveAttachments = false) {
      const body = { location:{ directory } }
      if (title) body.title = title
      if (state.draftAgent) body.agent = state.draftAgent
      if (state.draftModel) body.model = state.draftModel
      const result = await api('/api/session', { method:'POST', body:JSON.stringify(body) })
      const session = result.data
      state.sessions = [session, ...state.sessions.filter((item) => item.id !== session.id)]
      state.loading = false
      renderSessions()
      await selectSession(session.id, preserveAttachments)
      return session
    }

    async function startQuickSession() {
      if (state.busy) return
      state.busy = true; $('send').disabled = true; $('status').textContent = 'Создание быстрой сессии…'
      try {
        await createSessionAt(SCRATCH_DIRECTORY)
        $('status').textContent = 'Быстрая сессия'
      } catch (error) { $('status').textContent = `Не удалось создать сессию: ${error.message}` }
      finally { state.busy = false; $('send').disabled = false }
    }

    function askDelete(sessionID) {
      const session = state.sessions.find((item) => item.id === sessionID)
      if (!session) return
      state.pendingDelete = session
      $('deleteText').textContent = `«${sessionTitle(session)}» будет удалена без возможности восстановления.`
      $('deleteDialog').showModal()
    }

    async function deleteSession() {
      const session = state.pendingDelete
      if (!session) return
      $('confirmDelete').disabled = true
      try {
        await api(`/api/session/${encodeURIComponent(session.id)}`, { method:'DELETE' })
        state.sessions = state.sessions.filter((item) => item.id !== session.id)
        if (state.selected?.id === session.id) {
          state.selected = null; state.context = []; state.agents = []; state.models = []; state.providers = []; state.defaultModel = null; state.attachments = []
          $('messagesInner').innerHTML = '<div class="welcome">Задай быстрый вопрос ниже<br>или выбери сессию слева.</div>'
          $('input').disabled = false; $('attachButton').disabled = false; $('send').disabled = false
          renderHeader(); renderControls(); renderAttachments()
          loadDraftControls()
        }
        state.pendingDelete = null
        $('deleteDialog').close()
        renderSessions()
        $('status').textContent = `${state.sessions.length} сессий`
      } catch (error) { $('deleteText').textContent = `Не удалось удалить: ${error.message}` }
      finally { $('confirmDelete').disabled = false }
    }

    $('form').addEventListener('submit', sendMessage)
    $('newSession').addEventListener('click', startQuickSession)
    $('chooseProject').addEventListener('click', openProjectDialog)
    $('refresh').addEventListener('click', loadSessions)
    $('search').addEventListener('input', renderSessions)
    // --- Sidebar + кнопка «Назад» на мобиле: назад закрывает панель, а не страницу ---
    ;(() => {
      const sidebar = $('sidebar')
      let pushed = false
      const isMobile = () => window.matchMedia('(max-width:760px)').matches
      function openSidebar() {
        sidebar.classList.add('open')
        if (isMobile() && !pushed) { history.pushState({ sidebar:true }, '', location.href); pushed = true }
      }
      function closeSidebar() {
        if (!sidebar.classList.contains('open')) return
        sidebar.classList.remove('open')
        if (pushed) { pushed = false; history.back() }
      }
      $('menu').addEventListener('click', () => {
        if (sidebar.classList.contains('open')) closeSidebar()
        else openSidebar()
      })
      // тап вне боковой панели — закрыть
      document.addEventListener('click', (e) => {
        if (!isMobile() || !sidebar.classList.contains('open')) return
        if (e.target.closest('#sidebar') || e.target.closest('#menu')) return
        // клик по основному контенту — закрываем без push
        if (e.target.closest('.main')) closeSidebar()
      })
      window.addEventListener('popstate', () => {
        if (sidebar.classList.contains('open')) { sidebar.classList.remove('open'); pushed = false }
      })
      // селект сессии тоже закрывает панель (без возврата в истории — уже обрабатывалось)
      const _origSelect = selectSession
      // selectSession уже снимает .open, синхронизируем флаг
      const origToggle = sidebar.classList.toggle.bind(sidebar.classList)
      // при программном закрытии (selectSession) сбрасываем pushed без history.back()
      const mo = new MutationObserver(() => { if (!sidebar.classList.contains('open')) pushed = false })
      mo.observe(sidebar, { attributes:true, attributeFilter:['class'] })
    })()
    $('modelButton').addEventListener('click', openModelDialog)
    $('modelSearch').addEventListener('input', renderModelChoices)
    $('attachButton').addEventListener('click', () => $('fileInput').click())
    $('fileInput').addEventListener('change', (event) => { addFiles(event.target.files); event.target.value = '' })
    $('input').addEventListener('paste', (event) => {
      const files = [...(event.clipboardData?.items || [])].filter((item) => item.kind === 'file').map((item) => item.getAsFile()).filter(Boolean)
      if (!files.length) return
      event.preventDefault()
      addFiles(files)
    })
    $('variantSelect').addEventListener('change', (event) => {
      const ref = activeModelRef()
      if (!ref) return
      const model = { id:ref.id, providerID:ref.providerID }
      if (event.target.value) model.variant = event.target.value
      changeModel(model)
    })
    $('confirmDelete').addEventListener('click', deleteSession)
    document.querySelectorAll('[data-close]').forEach((button) => button.addEventListener('click', () => $(button.dataset.close).close()))
    document.querySelectorAll('dialog').forEach((dialog) => dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close() }))
    $('input').addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); $('form').requestSubmit() } })
    $('stopBtn').addEventListener('click', interruptSession)
    $('formStop').addEventListener('click', interruptSession)
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && state.busy && state.selected) { event.preventDefault(); interruptSession() } })

    // --- Permission handling (for Tailscale/mobile) ---
    let pendingPermission = null
    let permissionPollTimer = null
    const actionLabel = (action) => ({ bash:'Выполнение команды', edit:'Изменение файла', write:'Запись файла', read:'Чтение файла', glob:'Поиск файлов', grep:'Поиск по содержимому', list:'Список файлов', task:'Запуск подзадачи', webfetch:'Запрос в интернет', external_directory:'Доступ к директории вне проекта', external_file:'Доступ к файлу вне проекта' }[action] || action)
    function permissionDetail(p) {
      const parts = []
      if (p.action) parts.push(`${actionLabel(p.action)}: ${p.action}`)
      if (p.resources?.length) parts.push(`Ресурсы: ${p.resources.join(', ')}`)
      if (p.source?.id) parts.push(`Инструмент: ${p.source.id}`)
      return parts.join('\n')
    }
    function showPermission(p) {
      pendingPermission = p
      const detail = permissionDetail(p)
      $('permissionText').textContent = detail
      $('permissionBannerTitle').textContent = actionLabel(p.action)
      $('permissionBannerDetail').textContent = (p.resources || []).join(', ') || p.action
      $('permissionBanner').hidden = false
      if (!$('permissionDialog').open) $('permissionDialog').showModal()
    }
    function hidePermission() {
      pendingPermission = null
      $('permissionBanner').hidden = true
      if ($('permissionDialog').open) $('permissionDialog').close()
    }
    async function replyPermission(reply) {
      if (!pendingPermission) return
      const { id, sessionID } = pendingPermission
      const btns = ['permissionOnce','permissionAlways','permissionReject','bannerOnce','bannerAlways','bannerReject']
      btns.forEach((bid) => { const b = $(bid); if (b) b.disabled = true })
      try {
        await api(`/api/session/${encodeURIComponent(sessionID)}/permission/${encodeURIComponent(id)}/reply`, { method:'POST', body: JSON.stringify({ reply }) })
        hidePermission()
        setStatus(reply === 'reject' ? 'Отклонено' : reply === 'always' ? 'Разрешено навсегда' : 'Разрешено')
      } catch (error) {
        setStatus(`Ошибка разрешения: ${error.message}`)
      } finally {
        btns.forEach((bid) => { const b = $(bid); if (b) b.disabled = false })
        refreshPermissions()
      }
    }
    $('permissionOnce').addEventListener('click', () => replyPermission('once'))
    $('permissionAlways').addEventListener('click', () => replyPermission('always'))
    $('permissionReject').addEventListener('click', () => replyPermission('reject'))
    $('bannerOnce').addEventListener('click', () => replyPermission('once'))
    $('bannerAlways').addEventListener('click', () => replyPermission('always'))
    $('bannerReject').addEventListener('click', () => replyPermission('reject'))
    async function refreshPermissions() {
      if (!state.selected) { hidePermission(); return }
      try {
        const params = new URLSearchParams({ 'location[directory]': directory(state.selected) })
        const result = await api(`/api/permission/request?${params}`)
        const requests = result.data || []
        const pending = requests.find((request) => request.sessionID === state.selected.id) || requests[0]
        if (pending) showPermission(pending)
        else hidePermission()
      } catch { /* ignore polling errors */ }
    }
    function startPermissionPolling() {
      if (permissionPollTimer) clearInterval(permissionPollTimer)
      permissionPollTimer = setInterval(refreshPermissions, 1500)
    }
    const originalSelectSession = selectSession
    selectSession = async function(id, preserveAttachments) {
      const result = await originalSelectSession(id, preserveAttachments)
      refreshPermissions()
      return result
    }
    const originalHandleServerEvent = handleServerEvent
    handleServerEvent = function(payload) {
      originalHandleServerEvent(payload)
      if (payload.type === 'permission.asked') showPermission(payload.data)
      if (payload.type === 'permission.replied') refreshPermissions()
      if (['session.execution.started','session.tool.called','session.step.started'].includes(payload.type)) refreshPermissions()
      if (payload.type === 'session.execution.succeeded' || payload.type === 'session.execution.failed' || payload.type === 'session.execution.interrupted') hidePermission()
    }

    // --- Pull-to-refresh: сверху вниз И снизу вверх (кейс Chrome mobile внизу чата) — с анимацией ---
    ;(() => {
      const el = $('messages')
      const inner = $('messagesInner')
      const top = $('pullIndicator')
      const bottom = $('pullIndicatorBottom')
      const topText = top.querySelector('.pull-text')
      const bottomText = bottom.querySelector('.pull-text')
      const THRESHOLD = 72
      const MAX_PULL = 110
      let startY = 0, pulling = false, mode = null, didReady = false

      const isAtTop = () => el.scrollTop <= 4
      const isAtBottom = () => el.scrollTop + el.clientHeight >= el.scrollHeight - 4

      function reset() {
        pulling = false; mode = null; didReady = false
        inner.style.transition = ''
        inner.style.transform = ''
        top.style.height = '0px'; bottom.style.height = '0px'
        top.classList.remove('active','ready','done'); bottom.classList.remove('active','ready','done')
        topText.textContent = 'Потяни вниз для обновления'
        bottomText.textContent = 'Потяни вверх для обновления'
      }
      function onStart(y) {
        if (!isAtTop() && !isAtBottom()) return
        startY = y; pulling = true; mode = null; didReady = false
        inner.style.transition = 'none'
      }
      function onMove(y) {
        if (!pulling) return
        const dy = y - startY
        if (!mode) {
          if (dy > 8 && isAtTop()) mode = 'top'
          else if (dy < -8 && isAtBottom()) mode = 'bottom'
          else if (Math.abs(dy) > 8) { reset(); return }
          else return
        }
        if (mode === 'top') {
          if (dy <= 0) { reset(); return }
          if (!isAtTop()) { reset(); return }
          const h = Math.min(dy * 0.42, MAX_PULL)
          inner.style.transform = `translateY(${h}px)`
          top.style.height = h + 'px'
          top.classList.add('active')
          const ready = dy >= THRESHOLD
          top.classList.toggle('ready', ready)
          topText.textContent = ready ? 'Отпусти — обновится' : 'Потяни вниз для обновления'
          if (ready && !didReady) { didReady = true; try { navigator.vibrate(12) } catch {} }
          if (!ready) didReady = false
        } else if (mode === 'bottom') {
          const ady = -dy
          if (ady <= 0) { reset(); return }
          if (!isAtBottom()) { reset(); return }
          const h = Math.min(ady * 0.42, MAX_PULL)
          inner.style.transform = `translateY(${-h}px)`
          bottom.style.height = h + 'px'
          bottom.classList.add('active')
          const ready = ady >= THRESHOLD
          bottom.classList.toggle('ready', ready)
          bottomText.textContent = ready ? 'Отпусти — обновится' : 'Потяни вверх для обновления'
          if (ready && !didReady) { didReady = true; try { navigator.vibrate(12) } catch {} }
          if (!ready) didReady = false
        }
      }
      async function doRefresh(activeEl, activeText) {
        inner.style.transition = ''
        activeText.textContent = 'Обновление…'
        activeEl.classList.add('ready','active')
        activeEl.classList.remove('done')
        setStatus('Обновление…', true)
        if (mode === 'bottom') { bottom.style.height = '64px'; inner.style.transform = 'translateY(-64px)' }
        else { top.style.height = '64px'; inner.style.transform = 'translateY(64px)' }
        const tasks = [loadSessions()]
        if (state.selected) tasks.push(loadContext())
        try {
          await Promise.all(tasks)
          activeText.textContent = 'Готово ✓'
          activeEl.classList.remove('ready')
          activeEl.classList.add('done')
          setStatus('Обновлено')
          try { navigator.vibrate([12,40,12]) } catch {}
          await new Promise(r => setTimeout(r, 650))
        } catch (e) {
          activeText.textContent = 'Ошибка'
          setStatus('Ошибка обновления')
          await new Promise(r => setTimeout(r, 800))
        } finally { reset() }
      }
      function onEnd(y) {
        if (!pulling) return
        const dy = y - startY
        const wasMode = mode
        pulling = false
        inner.style.transition = ''
        if (wasMode === 'top' && dy >= THRESHOLD) doRefresh(top, topText)
        else if (wasMode === 'bottom' && -dy >= THRESHOLD) doRefresh(bottom, bottomText)
        else reset()
      }

      el.addEventListener('touchstart', (e) => onStart(e.touches[0].clientY), { passive: true })
      el.addEventListener('touchmove', (e) => onMove(e.touches[0].clientY), { passive: true })
      el.addEventListener('touchend', (e) => onEnd(e.changedTouches[0].clientY), { passive: true })
      el.addEventListener('touchcancel', reset, { passive: true })

      let mouseDown = false
      el.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return
        if (e.target.closest('button,a,details,summary,input,textarea,dialog,pre')) return
        mouseDown = true; onStart(e.clientY)
      })
      window.addEventListener('mousemove', (e) => { if (mouseDown && pulling) onMove(e.clientY) })
      window.addEventListener('mouseup', (e) => { if (!mouseDown) return; mouseDown = false; onEnd(e.clientY) })
    })()

    async function initialize() {
      await loadClientConfig()
      connectEvents()
      loadDraftControls()
      loadSessions()
      startPermissionPolling()
    }
    initialize().catch((error) => setStatus(`Ошибка запуска: ${error.message}`))
    setInterval(() => { if (!state.busy) loadSessions() }, 30000)
  </script>
</body>
</html>
