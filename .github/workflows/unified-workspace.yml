name: Unified Workspace

on:
  pull_request:
    paths:
      - 'app/**'
      - 'config/plugins/**'
      - 'scripts/**'
      - '.github/workflows/unified-workspace.yml'
  push:
    branches:
      - 'feature/unified-ux-runtime-20260901'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          python -m py_compile app/unified_control.py app/server_workflow.py
          node --check app/unified-workspace.js
      - name: Unified contract regression
        run: python scripts/unified-workspace-regression.py
      - name: TUI regression
        run: node scripts/tui-regression.mjs
      - name: TUI add wizard regression
        run: node scripts/tui-add-wizard-regression.mjs
      - name: Panel local-submit regression
        run: node scripts/panel-submit-regression.mjs
      - name: Existing verification suite
        run: bash scripts/verify.sh
      - name: Install reviewed OpenCode V2 build
        run: |
          prefix="$RUNNER_TEMP/opencode-v2"
          npm install --global --prefix "$prefix" @opencode-ai/cli@0.0.0-beta-18743
          bin="$prefix/bin/opencode2"
          test -x "$bin"
          "$bin" --version
          printf 'OPENCODE2_BIN=%s\n' "$bin" >> "$GITHUB_ENV"
      - name: Packaged TUI loader smoke
        run: bash scripts/tui-package-smoke.sh
