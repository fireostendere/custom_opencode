name: Publish audited stabilization

on:
  push:
    branches: ['astra/stabilization-20260909']
    paths: ['.github/workflows/stabilization-publish.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed product files only
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          raw = lzma.decompress(base64.b64decode(''.join(Path(f'.audit/delta-{i}.b64').read_text() for i in range(3)), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '6faba55b1656781618c33f9e29b29e7d3a4e9286d6fd3d9d3b85e03e5e5eb57c', 'Transport checksum mismatch'
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          root = Path.cwd().resolve()
          plan = []
          for entry in json.loads(raw):
              relative = Path(entry['path'])
              # Workflow edits are published separately by the authorized connector.
              if relative.parts[:2] == ('.github', 'workflows'):
                  continue
              assert not relative.is_absolute() and '..' not in relative.parts and '.git' not in relative.parts and relative.as_posix() != '.env'
              target = root / relative
              assert target.resolve().is_relative_to(root) and not target.is_symlink()
              old = target.read_bytes() if target.exists() else None
              assert (blob(old) if old is not None else None) == entry['old'], f'Unexpected base: {relative}'
              text = old.decode('utf-8') if old is not None else ''
              edits = entry['edits']
              assert all(0 <= start <= end <= len(text) for start, end, replacement in edits)
              assert all(edits[i][1] <= edits[i+1][0] for i in range(len(edits)-1))
              for start, end, replacement in reversed(edits):
                  text = text[:start] + replacement + text[end:]
              data = text.encode('utf-8')
              assert blob(data) == entry['new'], f'Unexpected result: {relative}'
              assert entry['mode'] in (0o644, 0o755)
              plan.append((target, data, entry['mode']))
          assert len(plan) == 56
          for target, data, mode in plan:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              os.chmod(target, mode)
          print(f'Applied {len(plan)} reviewed product files; all input/output blob hashes match')
          PY
          git rm .audit/delta-0.b64 .audit/delta-1.b64 .audit/delta-2.b64
          git add --all
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: stabilize native V2 plugins, wizards, runtime isolation and clean installation'
          git push origin HEAD:refs/heads/astra/stabilization-20260909
          git rev-parse HEAD
