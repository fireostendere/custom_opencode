name: Fix web status race

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-status-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Serialize status snapshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app/app.js')
          text=path.read_text(encoding='utf-8')
          anchor='let historyPaginationIntent = false\n'
          if anchor not in text: raise SystemExit('status generation anchor missing')
          if 'let statusSyncGeneration = 0\n' not in text:
              text=text.replace(anchor, anchor+'let statusSyncGeneration = 0\n', 1)

          old='''async function loadSessions({ selectHash = false, background = false } = {}) {
            if (!background && !state.sessions.length) { state.loading = true; renderSessions() }
            try {
              const [projects, sessions, statuses] = await Promise.all([api.listProjects(), api.listSessions(), api.sessionStatuses()])
              state.projects = projects
              const unique = new Map(sessions.map((s)=>[s.id,s]))
              state.sessions = [...unique.values()].sort(compareSessions)
              for (const [id,status] of Object.entries(statuses || {})) {
                if (runningStatus(status)) state.running.set(id,{ status:normalizeRunStatus(status), since:Date.now() })
                else if (state.running.has(id)) markFinished(id,'готово')
              }'''
          new='''async function loadSessions({ selectHash = false, background = false } = {}) {
            if (!background && !state.sessions.length) { state.loading = true; renderSessions() }
            const statusGeneration = ++statusSyncGeneration
            try {
              const [projects, sessions, statuses] = await Promise.all([api.listProjects(), api.listSessions(), api.sessionStatuses()])
              state.projects = projects
              const unique = new Map(sessions.map((s)=>[s.id,s]))
              state.sessions = [...unique.values()].sort(compareSessions)
              if (statusGeneration === statusSyncGeneration) for (const [id,status] of Object.entries(statuses || {})) {
                if (runningStatus(status)) state.running.set(id,{ status:normalizeRunStatus(status), since:Date.now() })
                else if (state.running.has(id)) markFinished(id,'готово')
              }'''
          if old not in text: raise SystemExit('loadSessions status block missing')
          text=text.replace(old,new,1)

          old="async function pollStatuses(){const statuses=await api.sessionStatuses();let changed=false;for(const session of state.sessions){const running=runningStatus(statuses?.[session.id]);if(running&&!isRunning(session.id)){state.running.set(session.id,{status:normalizeRunStatus(statuses[session.id]),since:Date.now()});changed=true}else if(!running&&isRunning(session.id)&&statuses&&session.id in statuses){markFinished(session.id,'готово');changed=true}}if(changed){renderSessions();renderHeader();updateBadge()}}"
          new="async function pollStatuses(){const statusGeneration=++statusSyncGeneration;const statuses=await api.sessionStatuses();if(statusGeneration!==statusSyncGeneration)return;let changed=false;for(const session of state.sessions){const running=runningStatus(statuses?.[session.id]);if(running&&!isRunning(session.id)){state.running.set(session.id,{status:normalizeRunStatus(statuses[session.id]),since:Date.now()});changed=true}else if(!running&&isRunning(session.id)&&statuses&&session.id in statuses){markFinished(session.id,'готово');changed=true}}if(changed){renderSessions();renderHeader();updateBadge()}}"
          if old not in text: raise SystemExit('pollStatuses block missing')
          text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-status-race.yml
          git add app/app.js
          git commit -m 'fix(web): ignore stale status snapshots before queue flush'
          git push origin HEAD:main
