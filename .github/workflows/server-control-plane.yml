name: Server control plane regression

on:
  push:
    branches:
      - main
      - server-control-plane-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repository verification
        run: ./scripts/verify.sh

      - name: Control-plane regression
        run: python3 ./scripts/control-plane-smoke.py

      - name: Clean install, update and web regression
        run: bash ./scripts/clean-install-regression.sh
