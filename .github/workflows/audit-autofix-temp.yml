name: temporary-full-audit

on:
  push:
    branches:
      - audit/full-review-20260901

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Finalize browser regression contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/web-fixture-e2e.py')
          s=p.read_text()
          old='''    for expected in (160, 240, 241):\n        page.locator("#messages").hover()\n        page.mouse.wheel(0, -100000)\n        page.wait_for_function(f"document.querySelectorAll('#messages .message').length === {expected}")\n'''
          new='''    initial_history_requests = [request for request in FixtureState.message_requests if request.get("limit") == ["80"]]\n    assert initial_history_requests == [{"limit": ["80"], "order": ["desc"]}], "initial layout must not page older history"\n    page.locator("#messages").hover()\n    page.mouse.wheel(0, -100000)\n    page.wait_for_function("document.querySelectorAll('#messages .message').length === 241")\n'''
          if new not in s:
              if old not in s: raise SystemExit('history pagination test marker missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          python3 -m py_compile scripts/web-fixture-e2e.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- scripts/web-fixture-e2e.py; then
            git add scripts/web-fixture-e2e.py
            git commit -m 'test: assert user-gated history pagination'
            git push origin HEAD:audit/full-review-20260901
          fi

      - name: Source checks
        run: |
          git diff --check
          node --check app/app.js
          node --check app/advanced-features.js
          python3 -m py_compile app/server.py scripts/web-fixture-e2e.py
          ! grep -q 'appendSessionToOrder' app/app.js

      - name: Hide audit harness from product checks
        run: rm -f .github/workflows/audit-autofix-temp.yml .github/audit-fix-initial-scroll.py .github/audit-fix-tree-regression.py .github/audit-fix-session-proxy.py .github/audit-fix-scroll-once.py .audit-trigger

      - name: Browser regression
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/queue-badge-convergence.py
          python3 scripts/web-fixture-e2e.py

      - name: Full source and runtime regression
        run: |
          set -euo pipefail
          if git grep -nE '(OpenCode V1|V1-only|из V1)' -- .; then exit 1; fi
          if git grep -nF 'совместимый `opencode`' -- .; then exit 1; fi
          if grep -Fq 'exec opencode "${args[@]}"' scripts/install.sh; then exit 1; fi
          python3 -m compileall -q app scripts
          for file in scripts/*.sh; do bash -n "$file"; done
          for file in app/*.js config/plugins/*.js; do node --check "$file"; done
          bash scripts/opencode-v2-bootstrap-regression.sh
          python3 scripts/security-boundary-smoke.py
          bash scripts/verify.sh
          bash scripts/ponytail-provision-regression.sh
          bash scripts/verify-runtime-v3.sh
          python3 scripts/model-routing-effort-smoke.py
          python3 scripts/runtime-invariants-smoke.py
          bash scripts/install-regression.sh
          python3 scripts/web-server-smoke.py
          python3 scripts/web-security-smoke.py
          node scripts/tui-regression.mjs
          node scripts/model-selector-smoke.mjs

      - name: Install current OpenCode 2 beta
        run: |
          npm install --global --prefix "$RUNNER_TEMP/opencode-v2" @opencode-ai/cli@beta
          "$RUNNER_TEMP/opencode-v2/bin/opencode2" --version
          echo "$RUNNER_TEMP/opencode-v2/bin" >> "$GITHUB_PATH"

      - name: Packaged OpenCode 2 TUI regression
        run: bash scripts/tui-package-smoke.sh
