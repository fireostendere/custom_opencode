name: temporary-full-audit

on:
  push:
    branches:
      - audit/full-review-20260901

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fix case-insensitive Connection regression assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/web-security-smoke.py')
          text=path.read_text(encoding='utf-8')
          old='        assert response_headers.get("connection", "").lower() == "close", response_headers\n'
          new='        assert any(key.lower() == "connection" and value.lower() == "close" for key, value in response_headers.items()), response_headers\n'
          if old not in text: raise SystemExit('connection assertion not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/web-security-smoke.py
          git commit -m 'test: normalize HTTP connection header check'
          git push origin HEAD:audit/full-review-20260901

      - name: Hide temporary audit files
        run: rm -f .github/workflows/audit-autofix-temp.yml .audit-trigger

      - name: V2-only and security gates
        run: |
          set -euo pipefail
          if git grep -nE '(OpenCode V1|V1-only|из V1)' -- .; then exit 1; fi
          if git grep -nF 'совместимый `opencode`' -- .; then exit 1; fi
          if grep -Fq 'exec opencode "${args[@]}"' scripts/install.sh; then exit 1; fi
          bash scripts/opencode-v2-bootstrap-regression.sh
          python3 scripts/security-boundary-smoke.py
          python3 scripts/web-server-smoke.py
          python3 scripts/web-security-smoke.py

      - name: Source/TUI regression
        run: |
          node --check app/app.js
          node scripts/tui-regression.mjs
          node scripts/model-selector-smoke.mjs

      - name: Current official OpenCode 2 beta and packaged TUI
        run: |
          npm install --global --prefix "$RUNNER_TEMP/opencode-v2" @opencode-ai/cli@beta
          "$RUNNER_TEMP/opencode-v2/bin/opencode2" --version
          echo "$RUNNER_TEMP/opencode-v2/bin" >> "$GITHUB_PATH"

      - name: Packaged OpenCode 2 TUI regression
        run: bash scripts/tui-package-smoke.sh

      - name: Browser convergence regressions
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/queue-badge-convergence.py
          python3 scripts/web-fixture-e2e.py