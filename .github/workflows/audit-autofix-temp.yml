name: temporary-full-audit

on:
  push:
    branches:
      - audit/full-review-20260901

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply final browser and HTTP fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(pathname, old, new):
              path = Path(pathname)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {pathname}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'app/app.js',
              "  if(anchor)view.scrollTop=anchor.top+view.scrollHeight-anchor.height;else if(bottom)view.scrollTop=view.scrollHeight;else if(stick)view.scrollTop=view.scrollHeight;else view.scrollTop=prev\n  updateScrollToBottomButton()\n}",
              "  if(anchor)view.scrollTop=anchor.top+view.scrollHeight-anchor.height\n  else if(bottom){\n    const sessionID=state.selected?.id\n    const settleBottom=()=>{if(state.selected?.id!==sessionID)return;view.scrollTop=view.scrollHeight;updateScrollToBottomButton()}\n    settleBottom()\n    requestAnimationFrame(()=>requestAnimationFrame(settleBottom))\n    if(document.fonts?.ready)document.fonts.ready.then(settleBottom).catch(()=>{})\n  }\n  else if(stick)view.scrollTop=view.scrollHeight\n  else view.scrollTop=prev\n  updateScrollToBottomButton()\n}",
          )

          replace(
              'app/server.py',
              '        self.send_header("X-Content-Type-Options", "nosniff")\n        self.send_header("Content-Length", str(len(body)))\n',
              '        self.send_header("X-Content-Type-Options", "nosniff")\n        if status >= 400:\n            # Error handlers may reject a POST before consuming its body. Close\n            # the HTTP/1.1 connection so those bytes cannot be parsed as a new request.\n            self.close_connection = True\n            self.send_header("Connection", "close")\n        self.send_header("Content-Length", str(len(body)))\n',
          )

          replace(
              'scripts/web-security-smoke.py',
              '        status, _, _ = request("POST", "/client-send.json", body={"sessionID": "x", "text": "x"}, headers=remote_headers)\n        assert status == 401, status\n',
              '        status, response_headers, _ = request("POST", "/client-send.json", body={"sessionID": "x", "text": "x"}, headers=remote_headers)\n        assert status == 401, status\n        assert response_headers.get("connection", "").lower() == "close", response_headers\n',
          )
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/app.js app/server.py scripts/web-security-smoke.py
          git commit -m 'fix: converge initial message scroll and close error connections'
          git push origin HEAD:audit/full-review-20260901

      - name: Hide temporary audit files from product verification
        run: rm -f .github/workflows/audit-autofix-temp.yml .audit-trigger

      - name: V2-only and hygiene scans
        run: |
          set -euo pipefail
          if git grep -nE '(OpenCode V1|V1-only|из V1)' -- .; then exit 1; fi
          if git grep -nF 'совместимый `opencode`' -- .; then exit 1; fi
          if grep -Fq 'exec opencode "${args[@]}"' scripts/install.sh; then exit 1; fi
          if git grep -nE '(/tmp/root|/home/[A-Za-z0-9._-]+/|[A-Za-z]:\\\\Users\\\\)' -- . ':!docs/**' ':!scripts/*regression*' ':!scripts/*smoke*'; then exit 1; fi
          if git grep -nE '(sk-[A-Za-z0-9_-]{24,}|gh[pousr]_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- . ':!.env.example'; then exit 1; fi
          echo 'V2-only + hygiene scan PASS'

      - name: Full zero-token verification
        run: |
          python3 -m compileall -q app scripts
          for file in scripts/*.sh; do bash -n "$file"; done
          for file in app/*.js config/plugins/*.js; do node --check "$file"; done
          bash scripts/opencode-v2-bootstrap-regression.sh
          python3 scripts/security-boundary-smoke.py
          bash scripts/verify.sh
          bash scripts/ponytail-provision-regression.sh
          bash scripts/verify-runtime-v3.sh
          python3 scripts/model-routing-effort-smoke.py
          python3 scripts/runtime-invariants-smoke.py

      - name: Fresh install and update regression
        run: bash scripts/install-regression.sh

      - name: Web backend and security regressions
        run: |
          python3 scripts/web-server-smoke.py
          python3 scripts/web-security-smoke.py

      - name: TUI source regressions
        run: |
          node scripts/tui-regression.mjs
          node scripts/model-selector-smoke.mjs

      - name: Official OpenCode 2 beta package smoke
        run: |
          npm install --global --prefix "$RUNNER_TEMP/opencode-v2" @opencode-ai/cli@beta
          "$RUNNER_TEMP/opencode-v2/bin/opencode2" --version
          echo "$RUNNER_TEMP/opencode-v2/bin" >> "$GITHUB_PATH"

      - name: Packaged OpenCode 2 TUI regression
        run: bash scripts/tui-package-smoke.sh

      - name: Install browser runtime
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Browser convergence regressions
        run: |
          python3 scripts/queue-badge-convergence.py
          python3 scripts/web-fixture-e2e.py