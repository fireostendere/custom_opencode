name: temporary-full-audit

on:
  push:
    branches:
      - audit/full-review-20260901

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove remaining V1 test markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/model-routing-effort-smoke.py')
          text = path.read_text(encoding='utf-8')
          old = 'for token in ("Planning policy", "conditional, not a ritual", "V1-only tool", "native", "primary `plan` agent", "short, obvious, bounded", "two or more meaningful stages", "before the first file mutation"):'
          new = 'for token in ("Planning policy", "conditional, not a ritual", "native", "primary `plan` agent", "short, obvious, bounded", "two or more meaningful stages", "before the first file mutation"):'
          if old not in text:
              raise SystemExit('model-routing V1 planning marker not found')
          text = text.replace(old, new, 1)
          old = 'for token in ("Планирование задач", "V1", "OpenCode V2", "plan", "2-7", "до первого изменения файла", "не создавай искусственный план"):'
          new = 'for token in ("Планирование задач", "OpenCode V2", "plan", "2-7", "до первого изменения файла", "не создавай искусственный план"):'
          if old not in text:
              raise SystemExit('model-routing AGENTS V1 marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit remaining cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/model-routing-effort-smoke.py
          if ! git diff --cached --quiet; then
            git commit -m 'test: drop remaining v1 policy markers'
            git push origin HEAD:audit/full-review-20260901
          fi

      - name: V2-only source scan
        run: |
          set -euo pipefail
          if git grep -nE '(OpenCode V1|V1-only|из V1)' -- . ':!.github/workflows/**'; then
            echo 'OpenCode V1 references remain' >&2
            exit 1
          fi
          if git grep -nF 'совместимый `opencode`' -- . ':!.github/workflows/**'; then
            echo 'unversioned OpenCode compatibility documentation remains' >&2
            exit 1
          fi
          if grep -Fq 'exec opencode "${args[@]}"' scripts/install.sh; then
            echo 'unversioned OpenCode runtime fallback remains' >&2
            exit 1
          fi
          echo 'OpenCode V2-only source scan PASS'

      - name: Repository hygiene scan
        run: |
          set -euo pipefail
          if git grep -nE '(/tmp/root|/home/[A-Za-z0-9._-]+/|[A-Za-z]:\\\\Users\\\\)' -- . ':!docs/**' ':!scripts/*regression*' ':!scripts/*smoke*' ':!.github/workflows/**'; then
            echo 'Unexpected machine-specific absolute path found' >&2
            exit 1
          fi
          if git grep -nE '(sk-[A-Za-z0-9_-]{24,}|gh[pousr]_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- . ':!.env.example'; then
            echo 'Possible committed credential found' >&2
            exit 1
          fi
          echo 'Repository hygiene scan PASS'

      - name: Syntax and compile scan
        run: |
          set -euo pipefail
          python3 -m compileall -q app scripts
          for file in scripts/*.sh; do bash -n "$file"; done
          for file in app/*.js config/plugins/*.js; do node --check "$file"; done
          git diff --check

      - name: V2 clean-bootstrap regression
        run: bash scripts/opencode-v2-bootstrap-regression.sh

      - name: Existing full verifier
        run: bash scripts/verify.sh

      - name: Ponytail provisioning regression
        run: bash scripts/ponytail-provision-regression.sh

      - name: Runtime V3 verifier
        run: bash scripts/verify-runtime-v3.sh

      - name: Routing and runtime invariants
        run: |
          python3 scripts/model-routing-effort-smoke.py
          python3 scripts/runtime-invariants-smoke.py

      - name: Fresh install and update regression
        run: bash scripts/install-regression.sh

      - name: Web backend and security regressions
        run: |
          python3 scripts/web-server-smoke.py
          python3 scripts/web-security-smoke.py

      - name: TUI source regressions
        run: |
          node scripts/tui-regression.mjs
          node scripts/model-selector-smoke.mjs

      - name: Official OpenCode 2 beta package smoke
        run: |
          npm install --global --prefix "$RUNNER_TEMP/opencode-v2" @opencode-ai/cli@beta
          "$RUNNER_TEMP/opencode-v2/bin/opencode2" --version

      - name: Packaged OpenCode 2 TUI regression
        run: bash scripts/tui-package-smoke.sh

      - name: Install browser runtime
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Browser convergence regressions
        run: |
          python3 scripts/queue-badge-convergence.py
          python3 scripts/web-fixture-e2e.py