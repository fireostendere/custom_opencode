name: DnD HTTP Hooks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dnd-http-hooks:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - name: Exercise production HTTP hooks without model calls
        run: node scripts/dnd-http-hooks-regression.mjs
