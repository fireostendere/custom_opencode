name: Prune obsolete diagnostic branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-extra-branch.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete obsolete branch and self-clean
        run: |
          git push origin --delete fix/real-model-selection-20260907
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prune-extra-branch.yml
          git commit -m 'chore: remove one-shot branch cleanup workflow'
          git push origin HEAD:main
