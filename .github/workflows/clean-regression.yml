name: Clean Regression

on:
  pull_request:
    paths: ['app/**', 'config/**', 'scripts/**', '.env.example', '.github/workflows/clean-regression.yml']
  push:
    branches: [main, 'astra/**']
    paths: ['app/**', 'config/**', 'scripts/**', '.env.example', '.github/workflows/clean-regression.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-free-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser, real CLI and policy dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium --only-shell
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          npm install --global --prefix "$RUNNER_TEMP/opencode-v2" @opencode-ai/cli@0.0.0-beta-18743
          echo "OPENCODE2_BIN=$RUNNER_TEMP/opencode-v2/bin/opencode2" >> "$GITHUB_ENV"
      - name: Run all 20 independent regression suites
        run: python scripts/audit-regression.py --output "$RUNNER_TEMP/regression"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-free-regression-${{ github.sha }}
          path: ${{ runner.temp }}/regression/
          retention-days: 7
          if-no-files-found: warn
  native-clean-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sandbox policy dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
      - name: Real installer, native configuration CRUD and real PTY
        run: python scripts/install-native-regression.py --output "$RUNNER_TEMP/native-install"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-install-${{ github.sha }}
          path: ${{ runner.temp }}/native-install/
          retention-days: 7
          if-no-files-found: warn
