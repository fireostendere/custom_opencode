name: Clean Regression

on:
  pull_request:
    paths:
      - 'app/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/clean-regression.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: fixture-gemini-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Syntax
        run: |
          python -m py_compile app/unified_control.py app/server_workflow.py scripts/local-web-harness.py scripts/browser-smoke.py scripts/web-critical-controls-e2e.py scripts/web-fixture-e2e.py scripts/runtime-queue-reconcile-smoke.py
          node --check app/unified-workspace.js
          node --check app/advanced-features.js
          bash -n scripts/tui-package-smoke.sh
      - name: Unified contract regression
        run: python scripts/unified-workspace-regression.py
      - name: TUI regression
        run: node scripts/tui-regression.mjs
      - name: TUI wizard regression
        run: |
          node scripts/tui-add-wizard-regression.mjs
          node scripts/tui-server-wizard-regression.mjs
          node scripts/tui-webserver-wizard-regression.mjs
          node scripts/wizard-validation-smoke.mjs
          node scripts/panel-submit-regression.mjs
      - name: Runtime queue reconciliation regression
        run: python scripts/runtime-queue-reconcile-smoke.py
      - name: Existing verification suite
        run: bash scripts/verify.sh
      - name: Install reviewed OpenCode V2 build
        run: |
          prefix="$RUNNER_TEMP/opencode-v2"
          rm -rf "$prefix"
          npm install --global --prefix "$prefix" @opencode-ai/cli@0.0.0-beta-18743
          bin="$prefix/bin/opencode2"
          test -x "$bin"
          "$bin" --version
          printf 'OPENCODE2_BIN=%s\n' "$bin" >> "$GITHUB_ENV"
      - name: Packaged TUI loader smoke
        run: bash scripts/tui-package-smoke.sh
      - name: Isolated production browser smoke
        run: python scripts/local-web-harness.py test
      - name: Critical web controls regression
        run: python scripts/web-critical-controls-e2e.py
      - name: Full fixture browser regression
        run: python scripts/web-fixture-e2e.py
