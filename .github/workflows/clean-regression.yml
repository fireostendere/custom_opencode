name: Clean Regression
on:
  pull_request:
  push:
    branches: [main, 'astra/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clean-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model-free-matrix:
    # Ubuntu 22.04 permits unprivileged network namespaces without disabling host policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser harness dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m pip install -r scripts/tool-fabric-requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Install pinned native OpenCode
        run: npm install -g @opencode-ai/cli@0.0.0-beta-18743
      - name: Run clean model-free regression matrix
        run: python scripts/audit-regression.py --output "$RUNNER_TEMP/regression"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-free-regression
          path: ${{ runner.temp }}/regression/
  native-clean-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Install native runtime from scratch and exercise TUI
        run: python scripts/install-native-regression.py --workdir "$RUNNER_TEMP/native-install"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-install-regression
          path: ${{ runner.temp }}/native-install/reports/
  native-budget-wire:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned native OpenCode
        run: npm install -g @opencode-ai/cli@0.0.0-beta-18743
      - name: Real native inference, retry, turn boundary and MCP wire contracts
        run: python scripts/native-budget-regression.py --retry-once --output "$RUNNER_TEMP/native-budget"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-budget-wire
          path: ${{ runner.temp }}/native-budget/evidence/
  kernel-sandbox:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install real isolation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python -m pip install -r scripts/tool-fabric-requirements.txt
      - name: Require kernel isolation and execute Tool Fabric acceptance
        run: |
          mkdir -p "$RUNNER_TEMP/kernel-sandbox"
          uname -a > "$RUNNER_TEMP/kernel-sandbox/kernel.txt"
          python scripts/sandbox-preflight.py --json | tee "$RUNNER_TEMP/kernel-sandbox/preflight.json"
          python scripts/tool-fabric-smoke.py | tee "$RUNNER_TEMP/kernel-sandbox/tool-fabric.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-sandbox
          path: ${{ runner.temp }}/kernel-sandbox/
