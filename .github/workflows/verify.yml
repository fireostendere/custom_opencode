name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - feat/server-runtime-v2

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python version
        run: python3 --version

      - name: Full static and runtime verifier
        run: bash scripts/verify.sh

      - name: Runtime V3 architecture verifier
        run: bash scripts/verify-runtime-v3.sh

      - name: Runtime workflow invariants
        run: python3 scripts/runtime-invariants-smoke.py

      - name: Fresh install and update regression
        run: bash scripts/install-regression.sh

      - name: Composed web-server regression
        run: python3 scripts/web-server-smoke.py

      - name: Web auth security regression
        run: python3 scripts/web-security-smoke.py

      - name: TUI limits regression
        run: node scripts/tui-regression.mjs

      - name: TUI model selector regression
        run: node scripts/model-selector-smoke.mjs

      - name: Install packaged OpenCode 2 beta
        run: npm install -g @opencode-ai/cli@beta

      - name: Packaged TUI regression
        run: bash scripts/tui-package-smoke.sh

      - name: Install Playwright Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Queue badge browser convergence
        run: python3 scripts/queue-badge-convergence.py

      - name: Desktop and mobile web browser regression
        run: python3 scripts/web-fixture-e2e.py
