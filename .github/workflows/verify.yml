name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile advanced workflow modules
        run: |
          python -m py_compile app/server_features.py app/server_workflow.py
          node --check app/advanced-features.js
          node --check app/ux-controls.js
      - name: Static and smoke verification
        run: bash scripts/verify.sh
