name: Audit Regression

on:
  push:
    branches: ['astra/stabilization-20260909']
    paths: ['.github/workflows/audit-regression.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare public browser and sandbox dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/audit-deps/browsers
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install chromium --only-shell
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          mkdir -p "$RUNNER_TEMP/audit-deps/bin"
          cp "$(command -v bwrap)" "$RUNNER_TEMP/audit-deps/bin/bwrap"
          bwrap --version > "$RUNNER_TEMP/audit-deps/bubblewrap-version.txt"
          ldd "$(command -v bwrap)" > "$RUNNER_TEMP/audit-deps/bubblewrap-libraries.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/audit-deps/commit.txt"
          tar -C "$RUNNER_TEMP/audit-deps" -czf "$RUNNER_TEMP/browser-sandbox.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: browser-sandbox-${{ github.sha }}
          path: ${{ runner.temp }}/browser-sandbox.tar.gz
          retention-days: 3
          if-no-files-found: error
